name: Build Fedra
on:
  push:
    branches:
      - main
  workflow_dispatch:
# Pushing again while a run is going makes that run pointless, so the new one replaces it.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
jobs:
  build:
    name: Build (${{ matrix.arch }})
    # A release commit gets its tag pushed too, and the release workflow builds that.
    if: ${{ !startsWith(github.event.head_commit.message, 'Release ') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
          - os: windows-11-arm
            arch: arm64
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: ${{ matrix.arch }}
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
        components: rustfmt, clippy
    # The x64 runner has CMake, and the MSVC step puts Visual Studio's Ninja on the PATH.
    - name: Install CMake and Ninja
      if: matrix.arch == 'arm64'
      run: |
        choco install cmake ninja -y
    # Fedra builds against wxWidgets master for fixes that aren't in a release yet.
    # The clone is cached per master commit, so a new commit is picked up on the next run.
    - name: Find wxWidgets master
      id: wxwidgets
      shell: bash
      run: echo "sha=$(git ls-remote https://github.com/wxWidgets/wxWidgets.git HEAD | cut -f1)" >> "$GITHUB_OUTPUT"
    - name: Cache wxWidgets source
      id: wxwidgets-cache
      uses: actions/cache@v6
      with:
        path: wxWidgets
        key: wxwidgets-src-${{ steps.wxwidgets.outputs.sha }}
    - name: Clone wxWidgets master
      if: steps.wxwidgets-cache.outputs.cache-hit != 'true'
      run: git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/wxWidgets/wxWidgets.git
    # wxWidgets is built by wxdragon-sys, so only its locked version decides whether a cached build still fits.
    - name: Find the locked wxdragon-sys
      id: wxdragon
      shell: bash
      run: echo "hash=$(awk '/^name = "wxdragon-sys"/{f=1} f&&/^$/{exit} f' Cargo.lock | grep -E '^(version|source|checksum) ' | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2
      with:
        # Shared with the other workflow, so a release build starts from the last build on main.
        shared-key: release-windows-${{ matrix.arch }}
        save-if: ${{ github.ref == 'refs/heads/main' }}
    # After the Rust cache, since post steps run in reverse: this one saves before rust-cache's cleanup would drop it.
    - name: Cache wxWidgets build
      uses: actions/cache@v6
      with:
        path: |
          target/release/wxwidgets_cmake_build
          target/release/wxdragon_sys_cmake_build
        key: wx-cmake-release-${{ runner.os }}-${{ matrix.arch }}-${{ steps.wxwidgets.outputs.sha }}-${{ steps.wxdragon.outputs.hash }}
    # A hit on the Rust cache with a miss on this one would leave wxdragon-sys counted as built with its libraries gone.
    - name: Rebuild wxdragon-sys if its CMake output is missing
      shell: pwsh
      run: |
        if (-not (Test-Path target/release/wxwidgets_cmake_build/libs/webview/packages)) {
          cargo clean --release -p wxdragon-sys
        }
    - name: Build and sign
      env:
        WXWIDGETS_DIR: ${{ github.workspace }}/wxWidgets
        MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
        MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
      run: cargo release
    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: fedra-build-${{ matrix.arch }}
        path: |
          target/release/fedra-${{ matrix.arch }}.zip
          target/release/fedra-${{ matrix.arch }}.zip.minisig
          target/release/fedra_setup-${{ matrix.arch }}.exe
          target/release/fedra_setup-${{ matrix.arch }}.exe.minisig
        retention-days: 30
  build-macos:
    name: Build (macOS)
    # A release commit gets its tag pushed too, and the release workflow builds that.
    if: ${{ !startsWith(github.event.head_commit.message, 'Release ') }}
    runs-on: macos-latest
    # Code signing and notarization run only when their secrets are set. Without them the DMG
    # still builds, but Gatekeeper makes people allow Fedra in System Settings on first launch.
    env:
      MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
      APPSTORE_API_KEY_BASE64: ${{ secrets.APPSTORE_API_KEY_BASE64 }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
        targets: aarch64-apple-darwin,x86_64-apple-darwin
    - name: Install CMake and Ninja
      run: brew install cmake ninja
    - name: Find wxWidgets master
      id: wxwidgets
      run: echo "sha=$(git ls-remote https://github.com/wxWidgets/wxWidgets.git HEAD | cut -f1)" >> "$GITHUB_OUTPUT"
    - name: Cache wxWidgets source
      id: wxwidgets-cache
      uses: actions/cache@v6
      with:
        path: wxWidgets
        key: wxwidgets-src-${{ steps.wxwidgets.outputs.sha }}
    - name: Clone wxWidgets master
      if: steps.wxwidgets-cache.outputs.cache-hit != 'true'
      run: git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/wxWidgets/wxWidgets.git
    # wxWidgets is built by wxdragon-sys, so only its locked version decides whether a cached build still fits.
    - name: Find the locked wxdragon-sys
      id: wxdragon
      shell: bash
      run: echo "hash=$(awk '/^name = "wxdragon-sys"/{f=1} f&&/^$/{exit} f' Cargo.lock | grep -E '^(version|source|checksum) ' | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2
      with:
        # Shared with the other workflow, so a release build starts from the last build on main.
        shared-key: release-macos
        save-if: ${{ github.ref == 'refs/heads/main' }}
    # After the Rust cache, since post steps run in reverse: this one saves before rust-cache's cleanup would drop it.
    - name: Cache wxWidgets build
      uses: actions/cache@v6
      with:
        path: |
          target/aarch64-apple-darwin/release/wxwidgets_cmake_build
          target/aarch64-apple-darwin/release/wxdragon_sys_cmake_build
          target/x86_64-apple-darwin/release/wxwidgets_cmake_build
          target/x86_64-apple-darwin/release/wxdragon_sys_cmake_build
        key: wx-cmake-release-${{ runner.os }}-${{ steps.wxwidgets.outputs.sha }}-${{ steps.wxdragon.outputs.hash }}
    # A hit on the Rust cache with a miss on this one would leave wxdragon-sys counted as built with its libraries gone.
    - name: Rebuild wxdragon-sys if its CMake output is missing
      run: |
        for target in aarch64-apple-darwin x86_64-apple-darwin; do
          test -d target/$target/release/wxwidgets_cmake_build || cargo clean --release -p wxdragon-sys --target $target
        done
    - name: Build, sign, and notarize
      # notarytool waits on Apple with no limit of its own, so without this the step could sit until the job's 6-hour limit.
      # It builds wxWidgets and notarizes a disk image for each architecture.
      timeout-minutes: 120
      env:
        WXWIDGETS_DIR: ${{ github.workspace }}/wxWidgets
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
        APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
        MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
      run: cargo release
    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: fedra-build-macos
        path: |
          target/release/fedra-arm64.dmg
          target/release/fedra-arm64.dmg.minisig
          target/release/fedra-x64.dmg
          target/release/fedra-x64.dmg.minisig
        retention-days: 30
  publish:
    name: Publish latest release
    needs: [build, build-macos]
    runs-on: ubuntu-latest
    # Every run publishes to the same latest release, so two uploading at once could mix one run's
    # assets with another's signatures. Queue them instead.
    concurrency:
      group: dev-release
      cancel-in-progress: false
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Download artifacts
      uses: actions/download-artifact@v8
      with:
        pattern: fedra-build-*
        path: dist
        merge-multiple: true
    - name: Get latest tag reachable from HEAD
      id: get_tag
      run: |
        TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
        echo "tag=$TAG" >> $GITHUB_OUTPUT
    - name: Generate release notes
      id: release_notes
      run: |
        PREV_TAG="${{ steps.get_tag.outputs.tag }}"
        if [ -z "$PREV_TAG" ]; then
          COMMITS=$(git log -1 --pretty=format:"- %h: %s" HEAD)
        else
          COMMITS=$(git log --pretty=format:"- %h: %s" "$PREV_TAG"..HEAD)
        fi
        COMMITS="${COMMITS//'%'/'%25'}"
        echo "commits<<EOF" >> $GITHUB_OUTPUT
        echo "$COMMITS" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
    - name: Create or update latest release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: latest
        name: Development Build
        body: |
          ## Commits since last release
          ${{ steps.release_notes.outputs.commits }}
        files: dist/*
        prerelease: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
