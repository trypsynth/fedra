name: Release Fedra
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
          - os: windows-11-arm
            arch: arm64
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: ${{ matrix.arch }}
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
        components: rustfmt, clippy
    - name: Install CMake and Ninja
      run: |
        choco install cmake ninja -y
    # Fedra builds against wxWidgets master for fixes that aren't in a release yet.
    # The clone is cached per master commit, so a new commit is picked up on the next run.
    - name: Find wxWidgets master
      id: wxwidgets
      shell: bash
      run: echo "sha=$(git ls-remote https://github.com/wxWidgets/wxWidgets.git HEAD | cut -f1)" >> "$GITHUB_OUTPUT"
    - name: Cache wxWidgets source
      id: wxwidgets-cache
      uses: actions/cache@v4
      with:
        path: wxWidgets
        key: wxwidgets-src-${{ steps.wxwidgets.outputs.sha }}
    - name: Clone wxWidgets master
      if: steps.wxwidgets-cache.outputs.cache-hit != 'true'
      run: git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/wxWidgets/wxWidgets.git
    - name: Build and sign
      env:
        WXWIDGETS_DIR: ${{ github.workspace }}/wxWidgets
        MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
        MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
      run: cargo release
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: fedra-release-${{ github.ref_name }}-${{ matrix.arch }}
        path: |
          target/release/fedra-${{ matrix.arch }}.zip
          target/release/fedra-${{ matrix.arch }}.zip.minisig
          target/release/fedra_setup-${{ matrix.arch }}.exe
          target/release/fedra_setup-${{ matrix.arch }}.exe.minisig
        retention-days: 90
  build-macos:
    name: Build (macOS arm64)
    runs-on: macos-latest
    # Code signing and notarization run only when their secrets are set. Without them the DMG
    # still builds, but Gatekeeper makes people allow Fedra in System Settings on first launch.
    env:
      MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
      APPSTORE_API_KEY_BASE64: ${{ secrets.APPSTORE_API_KEY_BASE64 }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
    - name: Install CMake and Ninja
      run: brew install cmake ninja
    - name: Find wxWidgets master
      id: wxwidgets
      run: echo "sha=$(git ls-remote https://github.com/wxWidgets/wxWidgets.git HEAD | cut -f1)" >> "$GITHUB_OUTPUT"
    - name: Cache wxWidgets source
      id: wxwidgets-cache
      uses: actions/cache@v4
      with:
        path: wxWidgets
        key: wxwidgets-src-${{ steps.wxwidgets.outputs.sha }}
    - name: Clone wxWidgets master
      if: steps.wxwidgets-cache.outputs.cache-hit != 'true'
      run: git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/wxWidgets/wxWidgets.git
    - name: Build, sign, and notarize
      env:
        WXWIDGETS_DIR: ${{ github.workspace }}/wxWidgets
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
        APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
        MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
      run: cargo release
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: fedra-release-${{ github.ref_name }}-macos
        path: |
          target/release/fedra-arm64.dmg
          target/release/fedra-arm64.dmg.minisig
        retention-days: 90
  release:
    name: Publish release
    needs: [build, build-macos]
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: fedra-release-${{ github.ref_name }}-*
        path: dist
        merge-multiple: true
    - name: Get previous tag
      id: prev_tag
      run: |
        PREV=$(git tag --sort=-version:refname | grep -v "^${{ github.ref_name }}$" | head -n 1 || echo "")
        echo "tag=$PREV" >> $GITHUB_OUTPUT
    - name: Create release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.ref_name }}
        name: ${{ github.ref_name }}
        files: dist/*
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
