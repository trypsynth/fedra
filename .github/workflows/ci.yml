name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
# Pushing again while a run is going makes that run pointless, so the new one replaces it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
jobs:
  fmt:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly
          components: rustfmt
      - name: Check formatting
        run: cargo +nightly fmt --all --check
  test:
    name: Tests and clippy
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy
      - name: Install CMake and Ninja
        run: choco install cmake ninja -y
      # Fedra builds against wxWidgets master for fixes that aren't in a release yet.
      # The clone is cached per master commit, so a new commit is picked up on the next run.
      - name: Find wxWidgets master
        id: wxwidgets
        shell: bash
        run: echo "sha=$(git ls-remote https://github.com/wxWidgets/wxWidgets.git HEAD | cut -f1)" >> "$GITHUB_OUTPUT"
      - name: Cache wxWidgets source
        id: wxwidgets-cache
        uses: actions/cache@v6
        with:
          path: wxWidgets
          key: wxwidgets-src-${{ steps.wxwidgets.outputs.sha }}
      - name: Clone wxWidgets master
        if: steps.wxwidgets-cache.outputs.cache-hit != 'true'
        run: git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/wxWidgets/wxWidgets.git
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      # wxdragon-sys builds wxWidgets with CMake into target/debug/*_cmake_build.
      # rust-cache wipes everything in target/debug except Cargo's own
      # directories before saving, even paths passed as cache-directories, so
      # these get their own cache. It has to come after rust-cache: post steps
      # run in reverse, so this one saves before rust-cache's cleanup runs.
      - name: Cache wxWidgets build
        uses: actions/cache@v6
        with:
          path: |
            target/debug/wxwidgets_cmake_build
            target/debug/wxdragon_sys_cmake_build
          key: wx-cmake-${{ runner.os }}-${{ steps.wxwidgets.outputs.sha }}-${{ hashFiles('Cargo.lock') }}
      # If the Rust cache hit but the wxWidgets one didn't, the restored
      # fingerprint says wxdragon-sys is built while its libraries are missing,
      # and linking fails on WebView2LoaderStatic.lib. Force it to rebuild.
      - name: Rebuild wxdragon-sys if its CMake output is missing
        shell: pwsh
        run: |
          if (-not (Test-Path target/debug/wxwidgets_cmake_build/libs/webview/packages)) {
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue target/debug/build/wxdragon-sys-*, target/debug/.fingerprint/wxdragon-sys-*
          }
      # Clippy runs first so the dependency tree is built once, in the same
      # profile the tests then reuse. Checking in release meant compiling
      # everything a second time under LTO for no extra findings.
      # The crate warns on clippy::all, pedantic and nursery, so -D warnings
      # makes every one of those fatal here.
      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
        env:
          WXWIDGETS_DIR: ${{ github.workspace }}/wxWidgets
      - name: Run tests
        run: cargo test --workspace
        env:
          WXWIDGETS_DIR: ${{ github.workspace }}/wxWidgets
